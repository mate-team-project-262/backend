name: Backend CI Pipeline

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-and-build-docker:
    name: Maven Verify (MySQL Testcontainers) & Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Verify Docker daemon availability for Testcontainers
        run: docker info > /dev/null

      - name: 3. Setup Java 21 LTS with Maven cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 4. Run Maven verify (Unit, Liquibase & MySQL Testcontainers integration tests)
        run: mvn clean verify -B

      - name: 5. Verify production multi-stage Docker image build
        run: docker build -t team262-backend:${{ github.sha }} .