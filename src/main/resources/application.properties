spring.application.name=movie-match

springdoc.api-docs.version=OPENAPI_3_0
springdoc.override-with-generic-response=false

room.max-participants=${ROOM_MAX_PARTICIPANTS:5}

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?connectionTimeZone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

title.source=${TITLE_SOURCE:stub}
tmdb.base-url=${TMDB_BASE_URL:https://api.themoviedb.org/3}
tmdb.api-key=${TMDB_API_KEY:}
tmdb.connect-timeout=${TMDB_CONNECT_TIMEOUT:3s}
tmdb.read-timeout=${TMDB_READ_TIMEOUT:5s}
tmdb.language=${TMDB_LANGUAGE:en-US}
tmdb.certification-country=${TMDB_CERTIFICATION_COUNTRY:US}
tmdb.max-response-bytes=${TMDB_MAX_RESPONSE_BYTES:4194304}

deck.max-page-window=${DECK_MAX_PAGE_WINDOW:50}
deck.initial-page-count=${DECK_INITIAL_PAGE_COUNT:4}
deck.max-discover-requests=${DECK_MAX_DISCOVER_REQUESTS:8}
deck.max-details-requests=${DECK_MAX_DETAILS_REQUESTS:30}
deck.build-timeout=${DECK_BUILD_TIMEOUT:60s}
