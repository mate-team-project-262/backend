spring.application.name=movie-match

springdoc.api-docs.version=OPENAPI_3_0
springdoc.override-with-generic-response=false

room.max-participants=${ROOM_MAX_PARTICIPANTS:5}

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?connectionTimeZone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

tmdb.base-url=${TMDB_BASE_URL}
tmdb.api-key=${TMDB_API_KEY}
