databaseChangeLog:
  - changeSet:
      id: 008-votes
      author: team262
      changes:
        - createTable:
            tableName: votes
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: participant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: room_title_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: is_liked
                  type: BIT(1)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP(6)
                  defaultValueComputed: CURRENT_TIMESTAMP(6)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: votes
            columnNames: participant_id, room_title_id
            constraintName: uk_votes_participant_card
        - addForeignKeyConstraint:
            baseTableName: votes
            baseColumnNames: participant_id
            referencedTableName: participants
            referencedColumnNames: id
            constraintName: fk_votes_participant
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: votes
            baseColumnNames: room_title_id
            referencedTableName: room_titles
            referencedColumnNames: id
            constraintName: fk_votes_room_title
            onDelete: CASCADE
      rollback:
        - dropTable:
            tableName: votes
